# Perform the `clear-human` ceremony from a comment the OPERATOR authored (#2895 family).
#
# WHY: `review:human` is human-ceremony-only (INVARIANT 2, #2285), and the sanctioned way to clear it runs
# `we:scripts/review-set-label.mjs` from a session on a host that holds a GitHub credential. An operator who is
# away from every such host has no way to perform it at all — and the request cannot travel the
# `ops/review-requests` path, because `we:scripts/apply-review-request.mjs` refuses `clear-human` outright and
# MUST keep refusing it: push access is not personhood.
#
# So the gesture comes from somewhere GitHub can vouch for. `issue_comment` carries a login and an
# `author_association` the commenter cannot set, both checked below and again in the script.
#
# WHAT THIS IS WORTH, precisely: it proves the OWNER'S ACCOUNT deliberately acted on this PR. It does not prove
# a physical gesture — #2946 (WebAuthn) is that, and stays open. And it is CONDITIONAL: the signal has force
# only because the host that asks for the clearance cannot itself act as the operator on GitHub (true of a
# Claude Code cloud VM, see `we:agent-memory-src/workflow-cloud-vm-github-api-boundary.md`). Give an agent on
# that host an owner-scoped token and this becomes the same self-assertion #2895 already describes.
#
# WHY `issue_comment` IS SAFE TO KEY ON, where `pull_request_target` would not be: this workflow always runs
# from the DEFAULT branch and never checks out the PR's head, so a PR cannot ship the workflow or the script
# that clears it. Nothing from the PR's tree executes here.
#
# NOTHING IS INFERRED FROM PROSE (#3060). The trigger is an exact token at the START of the comment; everything
# after it is carried verbatim as the reason and never read for meaning. Discussing a clearance does not
# perform one.
name: Clear human review hold

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write   # the label swap
  issues: write          # a PR's comments are issue comments
  contents: read         # never pushes

concurrency:
  # The #2964 ordering is a two-write sequence with no rollback; serialise for the same reason the
  # apply-review-request workflow does. `cancel-in-progress: false` — a cancelled run could stop BETWEEN writes.
  group: clear-human-request
  cancel-in-progress: false

jobs:
  clear:
    # DEFENCE IN DEPTH, not the real check. The script re-verifies the author and the token against the event
    # payload, because an `if:` is one edit away from being loosened by someone who reads it as a filter rather
    # than as a gate. Cheap here, decisive there.
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/clear-human')
    runs-on: ubuntu-latest
    steps:
      # main, never the PR's head — see the note above.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `review-set-label.mjs` transitively needs `markdown-it`, a transitive dependency of a devDependency, so
      # `--omit=dev` does not supply it. `--ignore-scripts`: this job holds a write token and its work is one
      # label and one comment. (Learned on run 32248646760, which collected its work correctly and then failed
      # every item at module resolution.)
      - run: npm ci --ignore-scripts

      - name: Perform the clearance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The event payload is the ONLY input. Nothing is read from the workflow's own inputs or from the PR.
        run: node scripts/clear-human-request.mjs --event="$GITHUB_EVENT_PATH"

      - name: Say so when it fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        # A clearance that silently does nothing is the failure mode worth spending a step on: the operator
        # asked, saw no error, and would reasonably believe the hold was lifted.
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n' \
            '❌ **The `/clear-human` request did not land.**' '' \
            'The hold still stands. See the workflow run linked on this PR for the refusal — the single home states its own reason verbatim.' '' \
            '---' '_Generated by [Claude Code](https://claude.ai/code)_')"
