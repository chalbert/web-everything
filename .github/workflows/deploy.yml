# Deploy the gated WE site to its Cloudflare Worker — ONLY for a commit whose required checks are green (#1137).
#
# WHY THIS IS NOT `on: push` ANY MORE (#xmiuo0r). The push trigger fired this workflow in PARALLEL with CI, on
# every push to `main`, and deployed whatever `main` happened to be at deploy time — regardless of whether CI
# passed, and regardless of whether the tree it built was the tree CI tested. Under a fast drain those are
# routinely DIFFERENT commits. Branch protection never covered this: `strict`/required checks gate a MERGE,
# not a push-triggered deploy, so the hole existed at `strict: true` too and simply became more likely to be
# hit once `strict` was turned off.
#
# THE TWO HALVES, and why both are needed:
#   1. TRIGGER — `workflow_run` on a SUCCESSFUL CI run, and check out `workflow_run.head_sha`. This is what
#      makes the deploy build the exact commit CI verified rather than the branch tip.
#   2. ENFORCEMENT — the "Refuse an unverified SHA" step below re-derives the verdict from the check-runs API
#      for the SHA it is about to ship, and exits non-zero unless every required context is green. The trigger
#      is wiring and can be mis-configured or bypassed (`workflow_dispatch`); the re-derive is the actual
#      guarantee. This mirrors the sole-writer rule the drain already follows
#      (`docs/agent/platform-decisions.md#event-driven-land-is-wake-only` clause 1): *a wake signal is never a
#      trusted land order — the gate is still re-derived server-side*. Same principle, applied to deploy.
#
# KNOWN GAP, deliberately not fixed here (#xd6hbxe): the FUI sibling is checked out at its DEFAULT branch with no
# `ref:`, so the build is not reproducible on the FUI side — a FUI change can alter what this deploys without
# any WE commit. Pinning it needs its own decision (which FUI ref is "the" one for a WE deploy), so it stays a
# separate item rather than a silent choice made here.
#
# CROSS-REPO build: WE's `build:docs` shells out to FUI's component-render tool
# (../frontierui/dist/tools/component-render/cli.mjs, ratified ordering #1946/#2016), so CI must
# check out BOTH repos as siblings and build FUI's tools first. Single-repo CI cannot build this site.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   FUI_READ_TOKEN        — fine-grained PAT, Contents:Read on chalbert/frontierui (checkout the sibling)
#   CLOUDFLARE_API_TOKEN  — scoped token, Workers Scripts · Edit (deploy)
#   CLOUDFLARE_ACCOUNT_ID — the account id
name: Deploy WE site (Cloudflare Worker)

on:
  # Fires when the CI workflow COMPLETES on main. The `conclusion == 'success'` filter is on the job below;
  # `types: [completed]` is the only type that carries a conclusion.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      break_glass:
        description: "Deploy even if the SHA's required checks are not green (emergency only — say why in the run notes)"
        type: boolean
        default: false

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  deploy:
    # Never even start for a red/cancelled CI run. The hard gate is still the re-derive step below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # workflow_run → the commit CI actually tested. workflow_dispatch → the branch tip at dispatch time.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # ── THE GATE ─────────────────────────────────────────────────────────────────────────────────────────
      # Re-derive the verdict for DEPLOY_SHA instead of trusting how this workflow was triggered. Deploy-time
      # admission control: the deployer verifies the artifact, it does not take the caller's word for it.
      - name: Refuse an unverified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          BREAK_GLASS: ${{ inputs.break_glass }}
        run: |
          set -euo pipefail
          echo "candidate: $DEPLOY_SHA"
          got=$(gh api "repos/${{ github.repository }}/commits/$DEPLOY_SHA/check-runs" \
                  --jq '[.check_runs[] | select(.name=="test" or .name=="smoke")
                         | {name, conclusion}] | sort_by(.name)')
          echo "required check-runs: $got"
          ok=$(printf '%s' "$got" | jq -r '
                 (map(select(.conclusion=="success") | .name) | unique) == ["smoke","test"]')
          if [ "$ok" = "true" ]; then
            echo "✓ $DEPLOY_SHA is verified green — proceeding"
          elif [ "${BREAK_GLASS:-false}" = "true" ]; then
            echo "::warning::BREAK GLASS — deploying $DEPLOY_SHA without green required checks"
          else
            echo "::error::refusing to deploy $DEPLOY_SHA — required checks are not both green"
            exit 1
          fi
      # ─────────────────────────────────────────────────────────────────────────────────────────────────────

      # Sibling layout under $GITHUB_WORKSPACE so WE's hardcoded `../frontierui` resolves:
      #   $GITHUB_WORKSPACE/web-everything  (this repo)
      #   $GITHUB_WORKSPACE/frontierui      (the tool sibling)
      - name: Checkout WE
        uses: actions/checkout@v4
        with:
          path: web-everything
          # THE POINT OF THIS CHANGE: build the commit CI verified, not the branch tip.
          ref: ${{ env.DEPLOY_SHA }}
      - name: Checkout FUI (sibling)
        uses: actions/checkout@v4
        with:
          repository: chalbert/frontierui
          token: ${{ secrets.FUI_READ_TOKEN }}
          path: frontierui

      - uses: actions/setup-node@v4
        with:
          node-version-file: web-everything/.nvmrc
          cache: npm
          cache-dependency-path: |
            web-everything/package-lock.json
            frontierui/package-lock.json

      # FUI tools first (ratified #1946/#2016 ordering) → produces dist/tools/component-render/cli.mjs
      - name: Build FUI tools
        working-directory: frontierui
        run: |
          npm ci
          npm run build:tools

      # WE site build (Eleventy calls the FUI CLI at ../frontierui/dist/tools/component-render/cli.mjs)
      - name: Build WE site
        working-directory: web-everything
        run: |
          npm ci
          npm run build:docs

      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web-everything
          # Pin to the version verified to honor `run_worker_first = ["/*"]` (the boolean form leaked;
          # a version mismatch here previously served content un-gated). Bump only after re-verifying the gate.
          wranglerVersion: "4.106.0"
          command: deploy

      - name: Record what shipped
        run: echo "deployed $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
